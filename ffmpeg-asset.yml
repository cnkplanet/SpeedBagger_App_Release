name: FFmpeg Asset Release

# 녹화용 ffmpeg를 이 배포 저장소에 전용 릴리스로 올린다.
# SpeedBagger 앱은 ffmpeg를 임베드하지 않고, 녹화를 켠 기기에서만 이 asset을 내려받는다
# (SpeedBagger_App 저장소 app_recorder_ffmpeg_install.go의 pinnedFFmpeg).
#
# ffmpeg를 바꿀 때 순서:
#   1. BtbN 릴리스에서 autobuild-* 태그의 win64-gpl zip 주소를 고른다. latest 주소는 계속 바뀌므로 쓰지 않는다.
#   2. 이 워크플로를 수동 실행한다(expected_sha256은 비워도 된다).
#   3. 실행 요약에 찍힌 SHA-256·크기·태그를 pinnedFFmpeg에 옮기고 앱을 릴리스한다.
#
# 앱 릴리스보다 먼저 올려야 한다. 순서가 바뀌면 새 앱이 없는 주소를 받으려다 녹화를 시작하지 못한다.
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'BtbN win64-gpl zip 주소(autobuild-* 태그로 고정된 주소)'
        required: true
        default: 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-14-13-17/ffmpeg-n8.1.2-52-g5a03dfa0f6-win64-gpl-8.1.zip'
      version:
        description: 'pinnedFFmpeg.Version과 같은 값. 릴리스 태그는 ffmpeg-<version>'
        required: true
        default: 'n8.1.2-52-g5a03dfa0f6'
      expected_sha256:
        description: 'ffmpeg.exe의 기대 SHA-256(pinnedFFmpeg.SHA256). 비우면 검증 없이 계산값만 출력'
        required: false
        default: '909fcaf460fd08b484fa76f8fadf454e11727e503df6e4b79ea24be33c7dd338'

# 같은 저장소에 릴리스를 만들므로 별도 토큰 없이 기본 GITHUB_TOKEN에 쓰기 권한만 준다.
permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_REPO: ${{ github.repository }}
      TAG: ffmpeg-${{ inputs.version }}
      # 입력값은 스크립트에 직접 끼워 넣지 않고 환경변수로 넘긴다(따옴표·특수문자로 스크립트가 깨지지 않게).
      SOURCE_URL: ${{ inputs.source_url }}
      VERSION: ${{ inputs.version }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
    steps:
      - name: Download & Extract
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile src.zip
          Expand-Archive -Path src.zip -DestinationPath src -Force
          $exe = Get-ChildItem -Path src -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $lic = Get-ChildItem -Path src -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in archive" }
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item $exe.FullName pkg/ffmpeg.exe
          if ($lic) { Copy-Item $lic.FullName pkg/LICENSE.txt }

      - name: Verify
        shell: pwsh
        run: |
          # libx264가 없으면 세그먼트 인코딩이 런타임에 실패한다.
          $enc = & pkg/ffmpeg.exe -hide_banner -encoders 2>&1 | Select-String -Pattern 'libx264'
          if (-not $enc) { throw "libx264 encoder missing — win64-gpl 빌드인지 확인 필요" }

          $sha = (Get-FileHash pkg/ffmpeg.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item pkg/ffmpeg.exe).Length
          $expected = "$env:EXPECTED_SHA256".Trim().ToLower()
          if ($expected -and $expected -ne $sha) { throw "SHA-256 mismatch: got $sha, expected $expected" }

          $ver = (& pkg/ffmpeg.exe -hide_banner -version | Select-Object -First 1)
          @"
          ## ffmpeg asset
          | 항목 | 값 |
          |---|---|
          | 태그 | ``$env:TAG`` |
          | Version | ``$env:VERSION`` |
          | SHA256 | ``$sha`` |
          | Size | ``$size`` |
          | ffmpeg | $ver |

          pinnedFFmpeg에 위 Version·SHA256·Size를 반영하세요.
          "@ | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path pkg/* -DestinationPath ffmpeg.zip -CompressionLevel Optimal
          Get-Item ffmpeg.zip | Select-Object Name, Length

      # "Latest"가 되면 launcher(releases/latest)가 이 릴리스에서 본체를 찾다가 업데이트가 깨진다.
      # --prerelease와 --latest=false를 함께 걸어 두 겹으로 막는다.
      - name: Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "SpeedBagger 녹화용 ffmpeg (앱이 자동으로 내려받는 파일입니다 — 앱 업데이트 릴리스가 아닙니다).`n`nSource: $env:SOURCE_URL`n`nFFmpeg is licensed under the GNU GPL v3 (see LICENSE.txt in the archive). Build by BtbN/FFmpeg-Builds; source: https://github.com/FFmpeg/FFmpeg"
          gh release view $env:TAG --repo $env:RELEASE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG ffmpeg.zip --repo $env:RELEASE_REPO --clobber
          } else {
            gh release create $env:TAG ffmpeg.zip --repo $env:RELEASE_REPO --title "FFmpeg $env:VERSION (recording tool)" --notes $notes --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }

      # 고객 PC가 받는 것과 같은 공개 주소로 다시 받아 확인한다(업로드 누락·권한 문제 조기 발견).
      - name: Verify Public Download
        shell: pwsh
        run: |
          $url = "https://github.com/$env:RELEASE_REPO/releases/download/$env:TAG/ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile check.zip
          Expand-Archive -Path check.zip -DestinationPath check -Force
          $a = (Get-FileHash check/ffmpeg.exe -Algorithm SHA256).Hash
          $b = (Get-FileHash pkg/ffmpeg.exe -Algorithm SHA256).Hash
          if ($a -ne $b) { throw "public download hash mismatch" }
          $latest = (Invoke-RestMethod "https://api.github.com/repos/$env:RELEASE_REPO/releases/latest").tag_name
          if ($latest -eq $env:TAG) { throw "ffmpeg 릴리스가 Latest로 지정됨 — launcher 업데이트가 깨집니다. 즉시 Latest를 앱 릴리스로 되돌리세요" }
          Write-Host "OK: $url (latest=$latest)"
